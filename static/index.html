<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --s0: #0f1117; --s1: #161822; --s2: #1e2030; --s3: #262940;
      --border: #2e3148; --border-h: #3d4166;
      --t1: #e2e4f0; --t2: #9499b8; --t3: #636888;
      --accent: #7c8aff; --accent-h: #939eff; --accent-bg: rgba(124,138,255,.1);
      --green: #5ccba0; --green-bg: rgba(92,203,160,.1);
      --red: #f0717b; --red-bg: rgba(240,113,123,.1);
      --yellow: #e5c07b; --yellow-bg: rgba(229,192,123,.1);
      --r: 8px; --rl: 12px;
      --sans: 'Inter', -apple-system, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    body { font-family: var(--sans); background: var(--s0); color: var(--t1); line-height: 1.6; -webkit-font-smoothing: antialiased; }
    button { font-family: var(--sans); cursor: pointer; border: none; outline: none; }
    input, select, textarea { font-family: var(--sans); outline: none; }

    .app { display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */
    .sidebar { width: 280px; min-width: 280px; background: var(--s1); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); }
    .sidebar-header h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
    .sidebar-header p { font-size: 12px; color: var(--t3); margin-top: 4px; }
    .sidebar-body { padding: 12px; flex: 1; overflow-y: auto; }
    .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--t3); padding: 8px; margin-bottom: 4px; }
    .nav-item { padding: 12px; border-radius: var(--r); cursor: pointer; transition: background .15s; margin-bottom: 2px; }
    .nav-item:hover { background: var(--s2); }
    .nav-item.active { background: var(--accent-bg); }
    .nav-name { font-size: 14px; font-weight: 500; }
    .nav-desc { font-size: 12px; color: var(--t2); margin-top: 2px; }
    .nav-schedule { font-size: 11px; font-family: var(--mono); color: var(--yellow); background: var(--yellow-bg); padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 6px; }

    /* Main */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--border); gap: 12px; }
    .topbar-title { font-size: 18px; font-weight: 600; }
    .content { flex: 1; overflow-y: auto; padding: 24px; }

    /* Buttons */
    .btn { padding: 8px 16px; border-radius: var(--r); font-size: 13px; font-weight: 500; transition: all .15s; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-h); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .btn-secondary { background: var(--s2); color: var(--t1); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--border-h); background: var(--s3); }

    /* Dialog */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); }
    .dialog { background: var(--s1); border: 1px solid var(--border); border-radius: var(--rl); padding: 24px; width: 520px; max-width: 90vw; max-height: 80vh; overflow-y: auto; box-shadow: 0 4px 24px rgba(0,0,0,.3); }
    .dialog h2 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .dialog-sub { font-size: 13px; color: var(--t2); margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--t2); }
    .form-label .req { color: var(--red); margin-left: 2px; }
    .form-input { width: 100%; padding: 10px 12px; background: var(--s0); border: 1px solid var(--border); border-radius: var(--r); color: var(--t1); font-size: 14px; transition: border-color .15s; }
    .form-input:focus { border-color: var(--accent); }
    .form-input::placeholder { color: var(--t3); }
    .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
    .cmd-preview { background: var(--s0); border: 1px solid var(--border); border-radius: var(--r); padding: 12px; margin-top: 16px; font-family: var(--mono); font-size: 12px; color: var(--t2); word-break: break-all; white-space: pre-wrap; }
    .cmd-label { font-family: var(--sans); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--t3); margin-bottom: 6px; }

    /* Runs */
    .run-list { display: flex; flex-direction: column; gap: 8px; }
    .run-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--s1); border: 1px solid var(--border); border-radius: var(--r); cursor: pointer; transition: all .15s; }
    .run-item:hover { border-color: var(--border-h); background: var(--s2); }
    .run-item.active { border-color: var(--accent); background: var(--accent-bg); }
    .run-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .run-dot.running { background: var(--yellow); animation: pulse 1.5s infinite; }
    .run-dot.completed { background: var(--green); }
    .run-dot.failed { background: var(--red); }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }
    .run-info { flex: 1; min-width: 0; }
    .run-agent { font-size: 14px; font-weight: 500; }
    .run-time { font-size: 12px; color: var(--t3); }
    .run-status-label { font-size: 12px; }
    .flag-btn { background: none; border: none; font-size: 14px; padding: 2px 4px; transition: all .15s; flex-shrink: 0; cursor: pointer; filter: brightness(0.3); color: var(--t3); }
    .flag-btn:hover { filter: brightness(0.6); color: var(--t2); }
    .flag-btn.active { filter: brightness(1); color: var(--t1); }
    .flag-btns { display: flex; gap: 2px; flex-shrink: 0; }

    /* File tabs */
    .file-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
    .file-tab { padding: 4px 10px; border-radius: var(--r); font-size: 12px; font-family: var(--mono); color: var(--t2); background: var(--s2); border: 1px solid var(--border); transition: all .15s; cursor: pointer; }
    .file-tab:hover { border-color: var(--border-h); }
    .file-tab.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }

    /* Markdown */
    .md-viewer { background: var(--s1); border: 1px solid var(--border); border-radius: var(--rl); padding: 32px; }
    .md-viewer h1 { font-size: 28px; font-weight: 700; margin-bottom: 16px; }
    .md-viewer h2 { font-size: 22px; font-weight: 600; margin-top: 28px; margin-bottom: 12px; }
    .md-viewer h3 { font-size: 18px; font-weight: 600; margin-top: 20px; margin-bottom: 8px; }
    .md-viewer p { margin-bottom: 12px; color: var(--t2); line-height: 1.7; }
    .md-viewer ul, .md-viewer ol { margin-bottom: 12px; padding-left: 24px; color: var(--t2); }
    .md-viewer li { margin-bottom: 4px; }
    .md-viewer code { font-family: var(--mono); font-size: 13px; background: var(--s2); padding: 2px 6px; border-radius: 4px; }
    .md-viewer pre { background: var(--s0); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; margin-bottom: 16px; overflow-x: auto; }
    .md-viewer pre code { background: none; padding: 0; }
    .md-viewer a { color: var(--accent); text-decoration: none; transition: color .15s; }
    .md-viewer a:hover { color: var(--accent-h); text-decoration: underline; }
    .md-viewer strong { color: var(--t1); }
    .md-viewer blockquote { border-left: 3px solid var(--accent); padding-left: 16px; margin-bottom: 12px; color: var(--t3); }
    .md-viewer table { border-collapse: collapse; width: 100%; margin-bottom: 16px; }
    .md-viewer th, .md-viewer td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; font-size: 14px; }
    .md-viewer th { background: var(--s2); font-weight: 600; }

    /* Config */
    .config-editor { width: 100%; min-height: 400px; padding: 16px; background: var(--s0); border: 1px solid var(--border); border-radius: var(--r); color: var(--t1); font-family: var(--mono); font-size: 13px; line-height: 1.6; resize: vertical; }
    .config-editor:focus { border-color: var(--accent); }

    /* Toast */
    .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: var(--r); font-size: 13px; font-weight: 500; z-index: 200; animation: slideIn .2s ease; }
    .toast.success { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
    .toast.error { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); }
    @keyframes slideIn { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* Layout helpers */
    .grid-2 { display: grid; grid-template-columns: 360px 1fr; gap: 24px; align-items: start; }
    .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--t3); text-align: center; padding: 40px; }
    .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: .3; }
    .empty h3 { font-size: 16px; font-weight: 500; margin-bottom: 8px; color: var(--t2); }
    .empty p { font-size: 13px; max-width: 300px; }
    .tag { font-size: 12px; background: var(--accent-bg); color: var(--accent); padding: 3px 8px; border-radius: 4px; display: inline-block; margin: 2px; }
    .group-header { font-size: 13px; font-weight: 600; color: var(--t3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
    .sub-header { font-size: 14px; font-weight: 600; color: var(--t3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 12px; }
    .detail-box { background: var(--s1); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; }
    .detail-row { font-size: 13px; margin-bottom: 8px; }
    .detail-row strong { color: var(--t1); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-h); }
  </style>
</head>
<body>
<div id="app" class="app"></div>

<script>
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const h = (tag, attrs = {}, ...children) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'className') el.className = v;
    else if (k === 'htmlContent') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c == null) continue;
    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return el;
};

// State
let state = {
  config: null,
  view: 'home',        // home | agent | outputs | config
  selectedAgent: null,
  runs: [],
  outputs: [],
  viewingFile: null,    // { agent, run, file, content }
  viewingRun: null,
};

// API
const api = {
  async getConfig() { return (await fetch('/api/config')).json(); },
  async saveConfig(data) { return (await fetch('/api/config', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) })).json(); },
  async getRuns() { return (await fetch('/api/runs')).json(); },
  async runAgent(name, params) { return (await fetch(`/api/agents/${name}/run`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(params) })).json(); },
  async getOutputs() { return (await fetch('/api/outputs')).json(); },
  async getFile(agent, run, file) { return (await fetch(`/api/outputs/${agent}/${run}/${file}`)).json(); },
};

// Toast
function showToast(msg, type = 'success') {
  const existing = $('.toast');
  if (existing) existing.remove();
  const t = h('div', { className: `toast ${type}` }, msg);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// Render
function render() {
  const app = $('#app');
  app.innerHTML = '';
  app.appendChild(renderSidebar());
  app.appendChild(renderMain());
}

function renderSidebar() {
  const agents = state.config?.agents || [];
  return h('div', { className: 'sidebar' },
    h('div', { className: 'sidebar-header' },
      h('h1', {}, 'Agent Dashboard'),
      h('p', {}, `${agents.length} agent${agents.length !== 1 ? 's' : ''} configured`),
    ),
    h('div', { className: 'sidebar-body' },
      h('div', { className: 'section-title' }, 'Navigation'),
      h('div', { className: `nav-item ${state.view === 'outputs' ? 'active' : ''}`, onClick: () => { state.view = 'outputs'; state.viewingFile = null; render(); loadOutputs(); } },
        h('div', { className: 'nav-name' }, 'All Outputs'),
        h('div', { className: 'nav-desc' }, 'Browse all generated files'),
      ),
      h('div', { className: `nav-item ${state.view === 'config' ? 'active' : ''}`, onClick: () => { state.view = 'config'; render(); } },
        h('div', { className: 'nav-name' }, 'Configuration'),
        h('div', { className: 'nav-desc' }, 'Edit agents.yaml'),
      ),
      h('div', { className: 'section-title', style: { marginTop: '16px' } }, 'Agents'),
      ...agents.map(a =>
        h('div', {
          className: `nav-item ${state.view === 'agent' && state.selectedAgent?.name === a.name ? 'active' : ''}`,
          onClick: () => { state.view = 'agent'; state.selectedAgent = a; state.viewingFile = null; state.viewingRun = null; render(); loadOutputs(); }
        },
          h('div', { className: 'nav-name' }, a.name),
          h('div', { className: 'nav-desc' }, a.description || ''),
          a.schedule ? h('div', { className: 'nav-schedule' }, a.schedule) : null,
        )
      ),
    ),
  );
}

function renderMain() {
  const main = h('div', { className: 'main' });

  // Topbar
  let title = 'Agent Dashboard';
  let actions = [];
  if (state.view === 'agent' && state.selectedAgent) {
    title = state.selectedAgent.name;
    const runBtn = h('button', { className: 'btn btn-primary', onClick: () => openSpawnDialog(state.selectedAgent) }, 'Run Agent');
    actions.push(runBtn);
  } else if (state.view === 'outputs') title = 'Output Browser';
  else if (state.view === 'config') title = 'Configuration';

  const topbar = h('div', { className: 'topbar' },
    h('div', { className: 'topbar-title' }, title),
    h('div', { style: { display: 'flex', gap: '8px' } }, ...actions),
  );
  main.appendChild(topbar);

  // Content
  const content = h('div', { className: 'content' });
  if (state.view === 'home') {
    content.appendChild(h('div', { className: 'empty' },
      h('div', { className: 'empty-icon' }, '⚙'),
      h('h3', {}, 'Select an agent'),
      h('p', {}, 'Choose an agent from the sidebar to view its details and outputs, or browse all outputs.'),
    ));
  } else if (state.view === 'agent') {
    content.appendChild(renderAgentView());
  } else if (state.view === 'outputs') {
    content.appendChild(renderOutputBrowser());
  } else if (state.view === 'config') {
    content.appendChild(renderConfigEditor());
  }
  main.appendChild(content);
  return main;
}

function renderAgentView() {
  const agent = state.selectedAgent;

  const wrapper = h('div', {});

  // Details
  const details = h('div', { style: { marginBottom: '24px' } },
    h('div', { className: 'sub-header' }, 'Agent Details'),
    h('p', { style: { fontSize: '14px', color: 'var(--t2)', marginBottom: '8px' } }, agent.description || ''),
    h('div', { style: { fontFamily: 'var(--mono)', fontSize: '12px', color: 'var(--t3)', background: 'var(--s1)', padding: '8px 12px', borderRadius: 'var(--r)', border: '1px solid var(--border)' } }, agent.command),
  );
  if (agent.params?.length) {
    const tags = h('div', { style: { marginTop: '12px', display: 'flex', gap: '6px', flexWrap: 'wrap' } },
      ...agent.params.map(p => h('span', { className: 'tag' }, `${p.name}${p.required ? '*' : ''}: ${p.type}`))
    );
    details.appendChild(tags);
  }
  wrapper.appendChild(details);

  // Unified run list from /api/runs (includes in-memory + historical)
  const allRuns = state.runs.filter(r => r.agent === agent.name);

  const grid = h('div', { className: 'grid-2' });
  const left = h('div', {});

  if (allRuns.length) {
    left.appendChild(h('div', {},
      h('div', { className: 'group-header' }, 'Runs'),
      h('div', { className: 'run-list' },
        ...allRuns.map(run => {
          const runKey = run.id || run.outputDir;
          const isSelected = state.viewingRun && (state.viewingRun.id || state.viewingRun.outputDir) === runKey;
          return h('div', {
            className: `run-item ${isSelected ? 'active' : ''}`,
            onClick: () => { state.viewingRun = run; state.viewingFile = null; render(); }
          },
            h('div', { className: `run-dot ${run.status}` }),
            h('div', { className: 'run-info' },
              h('div', { className: 'run-agent' }, run.id ? `Run #${run.id}` : run.startedAt),
              h('div', { className: 'run-time' }, run.startedAt ? new Date(run.startedAt).toLocaleString() : ''),
              run.params && Object.keys(run.params).length
                ? h('div', { style: { display: 'flex', gap: '4px', flexWrap: 'wrap', marginTop: '4px' } },
                    ...Object.entries(run.params).map(([k, v]) =>
                      h('span', { className: 'tag', style: { fontSize: '11px', padding: '1px 6px' } }, `${k}: ${v}`)
                    ),
                  )
                : null,
              (run.files && run.files.length)
                ? h('div', { className: 'file-tabs' },
                    ...run.files.map(f =>
                      h('button', {
                        className: `file-tab ${state.viewingFile?.file === f && state.viewingFile?.outputDir === run.outputDir ? 'active' : ''}`,
                        onClick: (e) => {
                          e.stopPropagation();
                          const parts = run.outputDir.split('/');
                          const runDir = parts[parts.length - 1];
                          const agentDir = parts[parts.length - 2];
                          loadFileContent({ agent: agentDir, run: runDir }, f);
                          state.viewingFile.outputDir = run.outputDir;
                        }
                      }, f)
                    ),
                  )
                : null,
            ),
            h('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: '4px', flexShrink: '0' } },
              h('span', { className: 'run-status-label', style: { color: run.status === 'completed' ? 'var(--green)' : run.status === 'failed' ? 'var(--red)' : 'var(--yellow)' } }, run.status),
              h('div', { className: 'flag-btns' },
                h('button', {
                  className: `flag-btn ${run.pinned ? 'active' : ''}`,
                  onClick: (e) => { e.stopPropagation(); toggleFlag(run, 'pinned'); },
                  title: run.pinned ? 'Unpin' : 'Pin to top',
                }, '📌'),
                h('button', {
                  className: `flag-btn ${run.starred ? 'active' : ''}`,
                  onClick: (e) => { e.stopPropagation(); toggleFlag(run, 'starred'); },
                  title: run.starred ? 'Unstar' : 'Star',
                }, '★'),
              ),
            ),
          );
        }),
      ),
    ));
  } else {
    left.appendChild(h('div', { style: { textAlign: 'center', padding: '24px', color: 'var(--t3)', fontSize: '13px' } },
      'No runs yet. ',
      h('button', { style: { color: 'var(--accent)', background: 'none', textDecoration: 'underline', border: 'none', cursor: 'pointer', fontFamily: 'var(--sans)', fontSize: '13px' }, onClick: () => openSpawnDialog(agent) }, 'Run this agent'),
    ));
  }

  grid.appendChild(left);

  // Right panel
  const right = h('div', {});

  if (state.viewingRun) {
    const run = state.viewingRun;
    const title = run.id ? `Run #${run.id}` : run.startedAt;
    const detailChildren = [
      h('div', { className: 'detail-row' }, h('strong', {}, 'Status: '), h('span', { style: { color: run.status === 'completed' ? 'var(--green)' : run.status === 'failed' ? 'var(--red)' : 'var(--yellow)' } }, run.status)),
    ];
    if (run.command) {
      detailChildren.push(h('div', { className: 'detail-row' }, h('strong', {}, 'Command:')));
      detailChildren.push(h('div', { className: 'cmd-preview' }, run.command));
    }
    if (run.stdout) {
      detailChildren.push(h('div', { style: { marginTop: '12px' } },
        h('div', { className: 'detail-row' }, h('strong', {}, 'Output:')),
        h('pre', { style: { background: 'var(--s0)', padding: '12px', borderRadius: 'var(--r)', fontSize: '12px', fontFamily: 'var(--mono)', whiteSpace: 'pre-wrap', color: 'var(--t2)' } }, run.stdout),
      ));
    }
    if (run.stderr) {
      detailChildren.push(h('div', { style: { marginTop: '12px' } },
        h('div', { className: 'detail-row' }, h('strong', {}, 'Errors:')),
        h('pre', { style: { background: 'var(--red-bg)', padding: '12px', borderRadius: 'var(--r)', fontSize: '12px', fontFamily: 'var(--mono)', whiteSpace: 'pre-wrap', color: 'var(--red)' } }, run.stderr),
      ));
    }
    right.appendChild(h('div', { style: { marginBottom: '24px' } },
      h('div', { className: 'sub-header' }, `${title} Details`),
      h('div', { className: 'detail-box' }, ...detailChildren),
    ));
  }

  if (state.viewingFile) {
    right.appendChild(h('div', {},
      h('div', { className: 'sub-header' }, state.viewingFile.file),
      h('div', { className: 'md-viewer', htmlContent: marked.parse(state.viewingFile.content || '') }),
    ));
  }

  if (!state.viewingRun && !state.viewingFile) {
    right.appendChild(h('div', { style: { textAlign: 'center', padding: '40px', color: 'var(--t3)', fontSize: '13px' } }, 'Select a run to view details, or click a file to read it'));
  }

  grid.appendChild(right);
  wrapper.appendChild(grid);
  return wrapper;
}

function renderOutputBrowser() {
  const wrapper = h('div', { className: 'grid-2' });

  const left = h('div', {});

  const filterInput = h('input', {
    type: 'text', className: 'form-input', placeholder: 'Filter by agent name...',
    style: { marginBottom: '16px' },
    onInput: (e) => { filterOutputs(e.target.value); }
  });
  left.appendChild(filterInput);

  const listContainer = h('div', { id: 'output-list' });
  left.appendChild(listContainer);
  renderOutputList(listContainer, state.runs.filter(r => r.files && r.files.length), '');

  wrapper.appendChild(left);

  // Right: viewer
  const right = h('div', {});
  if (state.viewingFile) {
    right.appendChild(h('div', { style: { fontSize: '13px', color: 'var(--t3)', marginBottom: '12px' } },
      `${state.viewingFile.agent} / ${state.viewingFile.run} / ${state.viewingFile.file}`
    ));
    right.appendChild(h('div', { className: 'md-viewer', htmlContent: marked.parse(state.viewingFile.content || '') }));
  } else {
    right.appendChild(h('div', { style: { textAlign: 'center', padding: '40px', color: 'var(--t3)', fontSize: '13px' } }, 'Select a file to view its contents'));
  }
  wrapper.appendChild(right);

  return wrapper;
}

function filterOutputs(term) {
  const container = $('#output-list');
  if (!container) return;
  const all = state.runs.filter(r => r.files && r.files.length);
  const filtered = term ? all.filter(o => o.agent.includes(term)) : all;
  renderOutputList(container, filtered, term);
}

function runDirName(run) {
  if (!run.outputDir) return '';
  return run.outputDir.split('/').pop();
}

function renderOutputList(container, outputs, filter) {
  container.innerHTML = '';
  const grouped = {};
  for (const o of outputs) {
    if (!grouped[o.agent]) grouped[o.agent] = [];
    grouped[o.agent].push(o);
  }
  for (const [agent, runs] of Object.entries(grouped)) {
    container.appendChild(h('div', { style: { marginBottom: '24px' } },
      h('div', { className: 'group-header' }, agent),
      h('div', { className: 'run-list' },
        ...runs.map(run => {
          const dirName = runDirName(run);
          return h('div', { className: `run-item ${state.viewingFile?.outputDir === run.outputDir ? 'active' : ''}` },
            h('div', { className: 'run-info' },
              h('div', { className: 'run-agent', style: { fontSize: '13px' } },
                run.id ? `Run #${run.id}` : run.startedAt || dirName,
              ),
              run.params && Object.keys(run.params).length
                ? h('div', { style: { display: 'flex', gap: '4px', flexWrap: 'wrap', marginTop: '4px' } },
                    ...Object.entries(run.params).map(([k, v]) =>
                      h('span', { className: 'tag', style: { fontSize: '11px', padding: '1px 6px' } }, `${k}: ${v}`)
                    ),
                  )
                : null,
              h('div', { className: 'file-tabs' },
                ...run.files.map(f =>
                  h('button', {
                    className: `file-tab ${state.viewingFile?.file === f && state.viewingFile?.outputDir === run.outputDir ? 'active' : ''}`,
                    onClick: (e) => {
                      e.stopPropagation();
                      loadFileContent({ agent: run.agent, run: dirName }, f);
                      state.viewingFile.outputDir = run.outputDir;
                    }
                  }, f)
                ),
              ),
            ),
            h('div', { className: 'flag-btns' },
              h('button', {
                className: `flag-btn ${run.pinned ? 'active' : ''}`,
                onClick: (e) => { e.stopPropagation(); toggleFlag(run, 'pinned'); },
                title: run.pinned ? 'Unpin' : 'Pin to top',
              }, '📌'),
              h('button', {
                className: `flag-btn ${run.starred ? 'active' : ''}`,
                onClick: (e) => { e.stopPropagation(); toggleFlag(run, 'starred'); },
                title: run.starred ? 'Unstar' : 'Star',
              }, '★'),
            ),
          );
        }),
      ),
    ));
  }
  if (!outputs.length) {
    container.appendChild(h('div', { style: { textAlign: 'center', padding: '24px', color: 'var(--t3)', fontSize: '13px' } }, 'No outputs found'));
  }
}

function renderConfigEditor() {
  const wrapper = h('div', {});

  const topRow = h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' } },
    h('div', { className: 'sub-header' }, 'agents.yaml'),
  );

  const saveBtn = h('button', { className: 'btn btn-primary', onClick: saveConfig }, 'Save Configuration');
  topRow.appendChild(saveBtn);
  wrapper.appendChild(topRow);

  const errorBox = h('div', { id: 'config-error', style: { display: 'none', background: 'var(--red-bg)', color: 'var(--red)', padding: '10px 14px', borderRadius: 'var(--r)', fontSize: '13px', marginBottom: '12px' } });
  wrapper.appendChild(errorBox);

  // We'll use a simple YAML serializer inline since we don't have js-yaml in the browser
  const textarea = h('textarea', { className: 'config-editor', id: 'config-textarea', spellcheck: 'false' });
  wrapper.appendChild(textarea);

  // Load current config as YAML text from server file
  fetch('/api/config').then(r => r.json()).then(data => {
    textarea.value = jsonToYaml(data);
  });

  return wrapper;
}

function jsonToYaml(obj, indent = 0) {
  const pad = '  '.repeat(indent);
  let out = '';
  if (Array.isArray(obj)) {
    for (const item of obj) {
      if (typeof item === 'object' && item !== null && !Array.isArray(item)) {
        const keys = Object.keys(item);
        out += `${pad}- ${keys[0]}: ${formatYamlValue(item[keys[0]])}\n`;
        for (const k of keys.slice(1)) {
          out += `${pad}  ${k}: ${formatYamlValue(item[k])}\n`;
          if (typeof item[k] === 'object' && item[k] !== null) {
            out = out.slice(0, -(formatYamlValue(item[k]).length + 1)) + '\n' + jsonToYaml(item[k], indent + 2);
          }
        }
      } else {
        out += `${pad}- ${formatYamlValue(item)}\n`;
      }
    }
  } else if (typeof obj === 'object' && obj !== null) {
    for (const [k, v] of Object.entries(obj)) {
      if (typeof v === 'object' && v !== null) {
        out += `${pad}${k}:\n${jsonToYaml(v, indent + 1)}`;
      } else {
        out += `${pad}${k}: ${formatYamlValue(v)}\n`;
      }
    }
  }
  return out;
}

function formatYamlValue(v) {
  if (v === null || v === undefined) return 'null';
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  if (typeof v === 'number') return String(v);
  if (typeof v === 'string') {
    if (v.includes('\n') || v.includes('"') || v.includes("'") || v.includes(':') || v.includes('{') || v.includes('#')) {
      return `"${v.replace(/\\/g, '\\\\').replace(/"/g, '\\"')}"`;
    }
    return v;
  }
  if (Array.isArray(v)) return `[${v.map(formatYamlValue).join(', ')}]`;
  return String(v);
}

async function saveConfig() {
  const textarea = $('#config-textarea');
  const errorBox = $('#config-error');
  const text = textarea.value;

  try {
    // Simple YAML parse: send as text, let server handle it
    // Actually we need to parse client-side. Let's use a simple approach:
    // Send the raw YAML text to a new endpoint, or parse it loosely.
    // Better: just send the text and let server parse.
    const res = await fetch('/api/config/raw', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: text,
    });
    if (res.ok) {
      state.config = await api.getConfig();
      showToast('Configuration saved');
      render();
    } else {
      const err = await res.json();
      errorBox.textContent = err.error;
      errorBox.style.display = 'block';
    }
  } catch (e) {
    errorBox.textContent = `Error: ${e.message}`;
    errorBox.style.display = 'block';
  }
}

// Spawn dialog
function openSpawnDialog(agent) {
  const existing = $('.overlay');
  if (existing) existing.remove();

  const params = agent.params || [];
  const values = {};
  for (const p of params) values[p.name] = p.default || '';

  function getResolvedCommand() {
    let cmd = agent.command || '';
    return cmd.replace(/\{\{(\w+)\}\}/g, (_, key) => {
      if (key === 'outputDir') return '<output-dir>';
      return values[key] || `{{${key}}}`;
    });
  }

  function canSubmit() {
    return params.filter(p => p.required).every(p => (values[p.name] || '').trim());
  }

  function buildDialog() {
    const overlay = h('div', { className: 'overlay', onClick: () => overlay.remove() });
    const dialog = h('div', { className: 'dialog', onClick: (e) => e.stopPropagation() },
      h('h2', {}, `Run ${agent.name}`),
      h('div', { className: 'dialog-sub' }, agent.description || ''),
    );

    const form = h('form', { onSubmit: async (e) => {
      e.preventDefault();
      overlay.remove();
      const res = await api.runAgent(agent.name, values);
      if (res.runId) {
        showToast(`Agent "${agent.name}" spawned`);
        refreshRuns();
      } else {
        showToast(res.error || 'Failed', 'error');
      }
    }});

    for (const p of params) {
      const group = h('div', { className: 'form-group' });
      const label = h('label', { className: 'form-label' }, p.label || p.name);
      if (p.required) label.appendChild(h('span', { className: 'req' }, '*'));
      group.appendChild(label);

      if (p.type === 'select') {
        const sel = h('select', { className: 'form-input', onChange: (e) => { values[p.name] = e.target.value; updatePreview(); } });
        for (const opt of (p.options || [])) {
          const o = h('option', { value: opt }, opt);
          if (opt === values[p.name]) o.selected = true;
          sel.appendChild(o);
        }
        group.appendChild(sel);
      } else if (p.type === 'textarea') {
        group.appendChild(h('textarea', {
          className: 'form-input', rows: '4', placeholder: p.placeholder || '',
          value: values[p.name] || '',
          onInput: (e) => { values[p.name] = e.target.value; updatePreview(); }
        }));
      } else {
        const inp = h('input', {
          type: 'text', className: 'form-input', placeholder: p.placeholder || '',
          value: values[p.name] || '',
          onInput: (e) => { values[p.name] = e.target.value; updatePreview(); }
        });
        group.appendChild(inp);
      }
      form.appendChild(group);
    }

    const previewSection = h('div', {},
      h('div', { className: 'cmd-label' }, 'Command Preview'),
      h('div', { className: 'cmd-preview', id: 'spawn-preview' }, getResolvedCommand()),
    );
    form.appendChild(previewSection);

    const actions = h('div', { className: 'dialog-actions' },
      h('button', { type: 'button', className: 'btn btn-secondary', onClick: () => overlay.remove() }, 'Cancel'),
      h('button', { type: 'submit', className: 'btn btn-primary', id: 'spawn-submit' }, 'Run'),
    );
    form.appendChild(actions);
    dialog.appendChild(form);
    overlay.appendChild(dialog);

    function updatePreview() {
      const preview = overlay.querySelector('#spawn-preview');
      if (preview) preview.textContent = getResolvedCommand();
      const submit = overlay.querySelector('#spawn-submit');
      if (submit) submit.disabled = !canSubmit();
    }

    updatePreview();
    return overlay;
  }

  document.body.appendChild(buildDialog());
  // Focus first input
  const firstInput = $('.dialog .form-input');
  if (firstInput) firstInput.focus();
}

async function loadFileContent(output, file) {
  const data = await api.getFile(output.agent, output.run, file);
  state.viewingFile = { agent: output.agent, run: output.run, file, content: data.content };
  state.viewingRun = null;
  render();
}

async function loadOutputs() {
  state.outputs = await api.getOutputs();
}

async function refreshRuns() {
  state.runs = await api.getRuns();
  state.outputs = await api.getOutputs();
  render();
}

async function toggleFlag(run, flag) {
  await fetch('/api/flag', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ outputDir: run.outputDir, flag }),
  });
  await refreshRuns();
}

// Init
const renderer = new marked.Renderer();
const origLink = renderer.link.bind(renderer);
renderer.link = function(args) {
  const html = origLink(args);
  return html.replace('<a ', '<a target="_blank" rel="noopener noreferrer" ');
};
marked.setOptions({ renderer });

async function init() {
  state.config = await api.getConfig();
  state.runs = await api.getRuns();
  state.outputs = await api.getOutputs();
  render();

  // Poll for updates
  setInterval(async () => {
    const prevRuns = JSON.stringify(state.runs);
    state.runs = await api.getRuns();
    const newRuns = JSON.stringify(state.runs);
    if (prevRuns !== newRuns) {
      state.outputs = await api.getOutputs();
      render();
    }
  }, 2000);

  // Refresh outputs periodically
  setInterval(async () => {
    state.outputs = await api.getOutputs();
  }, 5000);
}

init();
</script>
